# Publica el demo en GitHub Pages como export estático (Next.js `output: "export"`).
# URL: https://rjaramilloestrada.github.io/thebond-demo/
# Requiere: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Publicar en GitHub Pages

on:
  push:
    branches: [claude-rjp/beautiful-gates-92jv18]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancela uno en curso (recomendación de GitHub para Pages).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (export estático en out/)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /thebond-demo
          NEXT_PUBLIC_SITE_URL: https://rjaramilloestrada.github.io/thebond-demo
          # Solo en el build de Pages: vista previa privada, sin indexar (GitHub Pages no admite contraseña).
          NEXT_PUBLIC_NOINDEX: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
